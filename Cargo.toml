[package]
name = "niri-worktrees"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "niri-worktrees"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
comfy-table = "7.1.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
shlex = "1.3.0"
thiserror = "2.0.12"
toml = "0.8.23"
niri-ipc = "=26.4.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"
